# Публикация нашей сборки HuskSync в свой Reposilite, раздел-кандидат пары
# форков `fork-snapshot` (вики, ADR-0056). Координата
# ru.xmine.thirdparty:husksync, потребитель - XMineNode (plugins/common.yml).
#
# Что в форке изменено: подстановка переменных среды в config.yml и накат
# достижений из снапшота без тостов (synchronization.silent_advancements).
#
# ЭТОТ РЕПОЗИТОРИЙ ПУБЛИЧНЫЙ, поэтому `runs-on` здесь - только раннеры GitHub
# и никогда `self-hosted`: на свои раннеры пускаются только приватные
# репозитории (вики, infra/ci.md, «Граница безопасности»). По той же причине
# нет триггера `pull_request` - PR из форка исполнял бы свою версию этого файла
# с нашими секретами, - а job не запускается в форках самого форка.
#
# Секреты называются MAVEN_USERNAME / MAVEN_PASSWORD - так их завёл владелец
# именно в этом репозитории (как в CoreProtect).

name: XMine - publish HuskSync

on:
  push:
    branches: ['xmine/**']
  workflow_dispatch:

# Публикация не должна идти в два потока: параллельные сборки означали бы
# гонку за то, чья версия попадёт под координату.
concurrency:
  group: xmine-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Апстримная версия - единственное, что здесь задаётся руками: из git её не
  # вывести, она говорит, поверх какого релиза сделан форк (plugin_version в
  # gradle.properties). Меняется при перебазировании на новый апстрим, а не при
  # каждой нашей правке.
  #
  # Остальное считает шаг «Версия» ниже: <апстрим>-<ветка>-<ГГГГ-ММ-ДД>-<хеш>.
  UPSTREAM_VERSION: "4.0.0"
  MAVEN_GROUP_PATH: ru/xmine/thirdparty
  MAVEN_ARTIFACT: husksync
  # Раздел-кандидат пары форков, а не third-party: third-party - зеркало ЧУЖИХ
  # артефактов, а сборку форка правим и собираем мы, поэтому у неё есть стадия.
  MAVEN_SECTION: fork-snapshot
  # Имя файла задаёт shadowJar (корневой build.gradle, subprojects.shadowJar)
  JAR_GLOB: target/HuskSync-Bukkit-*+mc.26.1.2.jar

jobs:
  publish:
    # Форки самого форка не должны пытаться публиковать в наш Reposilite.
    if: github.repository == 'XMineServer/HuskSync'
    runs-on: ubuntu-latest

    env:
      XMINE_MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      XMINE_MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Версия
        # Считается из коммита, а не берётся из константы: координата обязана
        # различать сборки. `/` в имени ветки заменяется на `-` - в версии Maven
        # это разделитель пути в раскладке репозитория, и артефакт уехал бы не туда.
        run: |
          set -eu
          branch=$(printf '%s' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9.' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          read -r cdate chash < <(git log -1 --format='%cs %h')
          echo "XMINE_VERSION=${UPSTREAM_VERSION}-${branch}-${cdate}-${chash}" >> "$GITHUB_ENV"

      - name: Fail early without credentials
        run: |
          set -eu
          if [ -z "${XMINE_MAVEN_USERNAME:-}" ] || [ -z "${XMINE_MAVEN_PASSWORD:-}" ]; then
            echo "::error::Secrets MAVEN_USERNAME / MAVEN_PASSWORD are not set"
            exit 1
          fi

      - name: Занята ли координата
        id: exists
        # Координата неизменяема, поэтому «уже опубликовано» - законный ответ, а не
        # ошибка. Коды различаются намеренно: 404 - публиковать, 200 - пропустить,
        # всё остальное - падать. 401 при неверном имени секрета иначе выглядел бы
        # как «артефакта нет».
        run: |
          set -eu
          BASE="https://maven.xmine.world/${MAVEN_SECTION}/${MAVEN_GROUP_PATH}/${MAVEN_ARTIFACT}/${XMINE_VERSION}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                   --user "${XMINE_MAVEN_USERNAME}:${XMINE_MAVEN_PASSWORD}" \
                   "${BASE}/${MAVEN_ARTIFACT}-${XMINE_VERSION}.pom")
          case "$CODE" in
            404) echo "found=false" >> "$GITHUB_OUTPUT"; echo "Публикуем ${XMINE_VERSION}" ;;
            200) echo "found=true"  >> "$GITHUB_OUTPUT"
                 echo "${XMINE_VERSION} уже в разделе ${MAVEN_SECTION} - собирать нечего" ;;
            *)   echo "::error::${BASE} ответил $CODE - это не «есть» и не «нет»"; exit 1 ;;
          esac

      - name: Test
        if: steps.exists.outputs.found == 'false'
        # Только common: там весь тестовый набор проекта (без testcontainers и
        # без Docker), platform-модули (bukkit/fabric) тестов не имеют.
        run: ./gradlew :common:test --stacktrace

      - name: Build
        if: steps.exists.outputs.found == 'false'
        # Нода тянет сборку Paper/Bukkit под 26.1.2. Остальные bukkit-модули
        # (1.21.10, 1.21.11, 26.2) и fabric не публикуются - на проде их нет.
        run: ./gradlew :bukkit:26.1.2:shadowJar --stacktrace

      - name: Publish to Reposilite
        if: steps.exists.outputs.found == 'false'
        # maven-publish кладёт рядом с jar сгенерированный pom - без него координата
        # неполна, и резолвер на той стороне спотыкается.
        run: |
          XMINE_MAVEN_URL="https://maven.xmine.world/${MAVEN_SECTION}" \
            ./gradlew :bukkit:26.1.2:publishXmineForkPublicationToXmineRepository \
            -PxmineVersion="${XMINE_VERSION}" --stacktrace

      - name: Verify the way XMineNode will fetch it
        if: steps.exists.outputs.found == 'false'
        # Сверка идёт ровно тем путём, которым пойдёт сборка образа: качаем по прямому
        # адресу и сличаем хеш. Без этого «опубликовано» означает лишь «сервер ответил 2xx».
        run: |
          set -eu
          BASE="https://maven.xmine.world/${MAVEN_SECTION}/${MAVEN_GROUP_PATH}/${MAVEN_ARTIFACT}/${XMINE_VERSION}"
          curl --fail-with-body --silent --show-error \
               --user "${XMINE_MAVEN_USERNAME}:${XMINE_MAVEN_PASSWORD}" \
               -o /tmp/roundtrip.jar "${BASE}/${MAVEN_ARTIFACT}-${XMINE_VERSION}.jar"

          JAR="$(ls ${JAR_GLOB} | head -n1)"
          LOCAL="$(sha256sum "${JAR}" | cut -d' ' -f1)"
          REMOTE="$(sha256sum /tmp/roundtrip.jar | cut -d' ' -f1)"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::Round-trip mismatch: local $LOCAL, published $REMOTE"
            exit 1
          fi

          {
            echo "### Published"
            echo '```'
            echo "$(echo "${MAVEN_GROUP_PATH}" | tr '/' '.'):${MAVEN_ARTIFACT}:${XMINE_VERSION}"
            echo "repo:        ${MAVEN_SECTION}"
            echo "sha256:      ${LOCAL}"
            echo "base commit: ${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Уже опубликовано
        if: steps.exists.outputs.found == 'true'
        run: |
          {
            echo "### Ничего не публиковалось"
            echo
            echo "\`${XMINE_VERSION}\` уже лежит в разделе \`${MAVEN_SECTION}\`:"
            echo "входы этой сборки с прошлой публикации не менялись."
          } >> "$GITHUB_STEP_SUMMARY"
